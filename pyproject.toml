[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localhost-doctor"
version = "0.1.0"
description = "MCP server that diagnoses broken XAMPP/WAMP localhost stacks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jazzfer Q. Inigo", email = "206848186+Jazzfer-2003@users.noreply.github.com" }
]
keywords = ["mcp", "xampp", "wamp", "apache", "mysql", "localhost", "ai-agent"]
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0",
]

[project.scripts]
localhost-doctor = "localhost_doctor.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localhost_doctor = ["kb/*.yaml"]
